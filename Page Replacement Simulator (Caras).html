<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Replacement Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --black:   #0f0f0f;
  --white:   #ffffff;
  --red:     #e02020;
  --red-dk:  #b81818;
  --red-lt:  #fdeaea;
  --yellow:  #f5c400;
  --yellow-lt:#fffbe6;
  --gray:    #f2f2f2;
  --gray2:   #e4e4e4;
  --gray3:   #a0a0a0;
  --border:  #d0d0d0;
  --text:    #0f0f0f;
  --radius:  6px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--white);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
}

/* ── Top bar ── */
.topbar {
  background: var(--black);
  padding: 0 2rem;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.topbar-tag {
  background: var(--red);
  color: var(--white);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 3px;
}
.topbar-title {
  color: var(--white);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: .04em;
}

/* ── Shell ── */
.shell {
  max-width: 1120px;
  margin: 0 auto;
  padding: 2.5rem 2rem 5rem;
}

/* ── Page heading ── */
.page-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
  margin-bottom: 2rem;
  padding-bottom: 1.5rem;
  border-bottom: 3px solid var(--black);
}
.heading-left h1 {
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 900;
  line-height: 1;
  letter-spacing: -.02em;
  color: var(--black);
}
.heading-left h1 span {
  color: var(--red);
}

.heading-badge {
  background: var(--yellow);
  color: var(--black);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 6px 14px;
  border-radius: 3px;
  align-self: flex-start;
}

/* ── Input panel ── */
.input-panel {
  background: var(--gray);
  border: 1.5px solid var(--gray2);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1.25rem;
}

.input-row {
  display: grid;
  grid-template-columns: 1fr 90px;
  gap: 1rem;
  align-items: start;
}
@media(max-width:480px){ .input-row{ grid-template-columns:1fr; } }

.field { display: flex; flex-direction: column; gap: 5px; }
.field-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--black);
}

input[type=text], input[type=number] {
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  outline: none;
  transition: border-color .15s;
}
input[type=text]:focus, input[type=number]:focus {
  border-color: var(--black);
}
input[type=number] { width: 100%; }
.err {
  font-size: 11px;
  color: var(--red);
  font-weight: 500;
  display: none;
}
.err.show { display: block; }

/* ── Algo buttons ── */
.algo-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--gray3);
  margin-right: 4px;
}
.algo-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.algo-btn {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  padding: 8px 18px;
  border: 1.5px solid var(--gray2);
  border-radius: var(--radius);
  background: var(--white);
  color: var(--gray3);
  cursor: pointer;
  transition: all .15s;
}
.algo-btn:hover {
  border-color: var(--black);
  color: var(--black);
}
.algo-btn.active {
  background: var(--black);
  border-color: var(--black);
  color: var(--white);
}
.btn-run {
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 700;
  padding: 10px 24px;
  background: var(--red);
  border: 1.5px solid var(--red);
  border-radius: var(--radius);
  color: var(--white);
  cursor: pointer;
  letter-spacing: .03em;
  transition: background .15s, border-color .15s;
}
.btn-run:hover { background: var(--red-dk); border-color: var(--red-dk); }
.btn-rand {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 600;
  padding: 10px 16px;
  background: var(--yellow);
  border: 1.5px solid var(--yellow);
  border-radius: var(--radius);
  color: var(--black);
  cursor: pointer;
  transition: opacity .15s;
}
.btn-rand:hover { opacity: .85; }


/* ── Panel algo row (inside input panel, at top) ── */
.input-panel {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.panel-algo-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding-bottom: 1rem;
  border-bottom: 1.5px solid var(--gray2);
}
/* ── Action row (below panel) ── */
.action-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 2rem;
}

/* ── Stats ── */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 1.5rem;
}
.stat {
  border: 1.5px solid var(--gray2);
  border-radius: var(--radius);
  padding: 14px 16px;
  background: var(--white);
  border-top: 4px solid var(--black);
}
.stat.s-fault { border-top-color: var(--red); }
.stat.s-hit   { border-top-color: #18b87a; }
.stat.s-ratio { border-top-color: var(--yellow); }
.stat.s-algo  { border-top-color: var(--black); }
.stat-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--gray3);
  margin-bottom: 6px;
}
.stat-val {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -.02em;
}
.stat-val.fault { color: var(--red); }
.stat-val.hit   { color: #18b87a; }
.stat-val.ratio { color: var(--black); }
.stat-val.algo  { font-size: 15px; color: var(--black); }

/* ── Legend ── */
.legend {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  margin-bottom: 1rem;
  font-size: 11px;
  font-weight: 600;
  color: var(--gray3);
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-pip {
  width: 12px; height: 12px;
  border-radius: 2px;
  border: 1.5px solid transparent;
  flex-shrink: 0;
}
.pip-ref   { background: #f0edff; border-color: var(--black); }
.pip-hit   { background: #e2f8ef; border-color: #18b87a; }
.pip-fault { background: var(--red-lt); border-color: var(--red); }
.pip-new   { background: var(--yellow-lt); border-color: var(--yellow); }

/* ══════════════════════════════════
   HORIZONTAL MATRIX TABLE
══════════════════════════════════ */
.matrix-wrap {
  overflow-x: auto;
  border: 1.5px solid var(--black);
  border-radius: var(--radius);
  background: var(--white);
}
.matrix-wrap table {
  border-collapse: collapse;
  width: max-content;
  min-width: 100%;
}

/* Row header (leftmost cell) */
.rh {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--white);
  background: var(--black);
  padding: 0 16px;
  text-align: left;
  white-space: nowrap;
  width: 84px;
  min-width: 84px;
  border-right: 1.5px solid #2a2a2a;
}

/* All data cells */
.matrix-wrap table td:not(.rh),
.matrix-wrap table th:not(.rh) {
  width: 50px;
  min-width: 50px;
  max-width: 50px;
  height: 46px;
  text-align: center;
  vertical-align: middle;
  padding: 0;
  font-size: 15px;
  font-weight: 700;
  border: 1px solid var(--gray2);
}

/* Reference row */
tr.row-ref { background: var(--black); }
tr.row-ref td:not(.rh) {
  font-size: 16px;
  font-weight: 800;
  color: var(--white);
  background: var(--black);
  border-color: #2a2a2a;
  height: 48px;
}
tr.row-ref td.col-hit   { color: #1fffa0; background: #0d1a14; border-color: #1a3328; }
tr.row-ref td.col-fault { color: #ff7a7a; background: #1e0808; border-color: #3a1010; }

/* Frame rows */
tr.row-frame td.fc-empty  { color: var(--gray2); background: var(--gray); font-size: 11px; }
tr.row-frame td.fc-filled { color: var(--black); background: var(--white); }
tr.row-frame td.fc-new    {
  color: var(--black);
  background: var(--yellow);
  border-color: #d4aa00;
  font-weight: 800;
}
tr.row-frame td.col-hit   { background: #e2f8ef; color: #0a6644; }
tr.row-frame td.col-hit.fc-new { background: var(--yellow); color: var(--black); }
tr.row-frame td.col-fault.fc-filled { background: var(--red-lt); color: var(--red-dk); }
tr.row-frame td.col-fault.fc-new    { background: var(--yellow); color: var(--black); }
tr.row-frame td.col-fault.fc-empty  { background: #fdf3f3; color: var(--gray2); }

/* Status row */
tr.row-status { background: var(--gray); }
tr.row-status td:not(.rh) {
  height: 34px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  border-top: 1.5px solid var(--black);
}
tr.row-status td.s-hit  {
  color: #0a6644;
  background: #e2f8ef;
  border-color: #b3e8d4;
}
tr.row-status td.s-fault {
  color: var(--red-dk);
  background: var(--red-lt);
  border-color: #f5c0c0;
}

/* Row alternating tint for frames */
tr.row-frame:nth-child(even) td.fc-filled { background: #fafafa; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--gray); }
::-webkit-scrollbar-thumb { background: var(--gray2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--gray3); }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <span class="topbar-tag">OS</span>
  <span class="topbar-title">Memory Management — Page Replacement Simulator</span>
</div>

<div class="shell">

  <!-- Heading -->
  <div class="page-heading">
    <div class="heading-left">
      <h1>Page <span>Replacement</span><br>Simulator</h1>

    </div>
    <div class="heading-badge">Interactive Tool</div>
  </div>

  <!-- Inputs -->
  <div class="input-panel">
    <div class="panel-algo-row">
      <span class="algo-label">Algorithm</span>
      <div class="algo-btns">
        <button class="algo-btn active" data-algo="FIFO"    onclick="selectAlgo(this)">FIFO</button>
        <button class="algo-btn"        data-algo="Optimal" onclick="selectAlgo(this)">Optimal</button>
        <button class="algo-btn"        data-algo="LRU"     onclick="selectAlgo(this)">LRU</button>
      </div>
    </div>
    <div class="input-row">
      <div class="field">
        <div class="field-label">Reference String</div>
        <input type="text" id="refStr" value="7 0 1 2 0 3 0 4 2 3 0 3 2"
          placeholder="e.g. 7 0 1 2 0 3 0 4 2 3 0 3 2">
        <span class="err" id="errStr">Space-separated non-negative integers only.</span>
      </div>
      <div class="field">
        <div class="field-label">Frames</div>
        <input type="number" id="numFrames" value="3" min="1" max="10">
        <span class="err" id="errFrames">Enter 1–10.</span>
      </div>
    </div>
  </div>

  <!-- Run + Random below the panel -->
  <div class="action-row">
    <button class="btn-run"  onclick="runSim()">&#9654; Run Simulation</button>
    <button class="btn-rand" onclick="randomRef()">&#8635; Random</button>
  </div>

  <!-- Output -->
  <div id="output"></div>

</div>

<script>
let selectedAlgo = 'FIFO';

function selectAlgo(btn) {
  document.querySelectorAll('.algo-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedAlgo = btn.dataset.algo;
}

function randomRef() {
  const len = 12 + Math.floor(Math.random() * 8);
  document.getElementById('refStr').value =
    Array.from({ length: len }, () => Math.floor(Math.random() * 8)).join(' ');
}

function validate() {
  const rs = document.getElementById('refStr').value.trim();
  const pages = rs.split(/\s+/).map(Number);
  const eS = document.getElementById('errStr');
  const eF = document.getElementById('errFrames');
  eS.classList.remove('show');
  eF.classList.remove('show');
  let ok = true;
  if (!rs || pages.some(isNaN) || pages.some(p => p < 0 || !Number.isInteger(p))) {
    eS.classList.add('show'); ok = false;
  }
  const f = parseInt(document.getElementById('numFrames').value);
  if (isNaN(f) || f < 1 || f > 10) {
    eF.classList.add('show'); ok = false;
  }
  return ok ? { pages, frames: f } : null;
}

/* ── Algorithms ── */
function fifo(pages, nf) {
  let frames = [], queue = [], faults = 0, hits = 0, steps = [];
  for (let i = 0; i < pages.length; i++) {
    const p = pages[i], isHit = frames.includes(p);
    let replaced = null;
    if (isHit) { hits++; }
    else {
      faults++;
      if (frames.length < nf) { frames.push(p); queue.push(p); }
      else { replaced = queue.shift(); frames[frames.indexOf(replaced)] = p; queue.push(p); }
    }
    steps.push({ ref: p, frames: [...frames], isHit, replaced });
  }
  return { faults, hits, steps };
}

function optimal(pages, nf) {
  let frames = [], faults = 0, hits = 0, steps = [];
  for (let i = 0; i < pages.length; i++) {
    const p = pages[i], isHit = frames.includes(p);
    let replaced = null;
    if (isHit) { hits++; }
    else {
      faults++;
      if (frames.length < nf) { frames.push(p); }
      else {
        let far = -1, vi = 0;
        for (let j = 0; j < frames.length; j++) {
          const nx = pages.slice(i + 1).indexOf(frames[j]);
          if (nx === -1) { vi = j; break; }
          if (nx > far) { far = nx; vi = j; }
        }
        replaced = frames[vi];
        frames[vi] = p;
      }
    }
    steps.push({ ref: p, frames: [...frames], isHit, replaced });
  }
  return { faults, hits, steps };
}

function lru(pages, nf) {
  let frames = [], recent = [], faults = 0, hits = 0, steps = [];
  for (let i = 0; i < pages.length; i++) {
    const p = pages[i], isHit = frames.includes(p);
    let replaced = null;
    if (isHit) { hits++; recent.splice(recent.indexOf(p), 1); recent.push(p); }
    else {
      faults++;
      if (frames.length < nf) { frames.push(p); recent.push(p); }
      else { replaced = recent.shift(); frames[frames.indexOf(replaced)] = p; recent.push(p); }
    }
    steps.push({ ref: p, frames: [...frames], isHit, replaced });
  }
  return { faults, hits, steps };
}

/* ── Render ── */
function renderOutput(result, pages, nf, algo) {
  const total = pages.length;
  const ratio = (result.hits / total * 100).toFixed(1);
  const steps = result.steps;

  let html = `
  <div class="stats">
    <div class="stat s-fault"><div class="stat-label">Page Faults</div><div class="stat-val fault">${result.faults}</div></div>
    <div class="stat s-hit">  <div class="stat-label">Page Hits</div>  <div class="stat-val hit">${result.hits}</div></div>
    <div class="stat s-ratio"><div class="stat-label">Hit Ratio</div>  <div class="stat-val ratio">${ratio}%</div></div>
    <div class="stat s-algo"> <div class="stat-label">Algorithm</div>  <div class="stat-val algo">${algo}</div></div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-pip pip-hit"></div>Page Hit</div>
    <div class="legend-item"><div class="legend-pip pip-fault"></div>Page Fault</div>
    <div class="legend-item"><div class="legend-pip pip-new"></div>Newly Loaded</div>
  </div>
  <div class="matrix-wrap"><table><tbody>`;

  /* Row: reference string */
  html += '<tr class="row-ref">';
  html += '<td class="rh">Page</td>';
  steps.forEach(s => {
    html += `<td class="${s.isHit ? 'col-hit' : 'col-fault'}">${s.ref}</td>`;
  });
  html += '</tr>';

  /* Rows: frames */
  for (let f = 0; f < nf; f++) {
    html += '<tr class="row-frame">';
    html += `<td class="rh">Frame ${f + 1}</td>`;
    steps.forEach(s => {
      const pg = s.frames[f];
      if (pg === undefined) {
        html += `<td class="fc-empty col-${s.isHit ? 'hit' : 'fault'}">—</td>`;
      } else {
        const isNew = !s.isHit && pg === s.ref;
        const colCls = `col-${s.isHit ? 'hit' : 'fault'}`;
        html += `<td class="${isNew ? 'fc-new' : 'fc-filled'} ${colCls}">${pg}</td>`;
      }
    });
    html += '</tr>';
  }

  /* Row: status */
  html += '<tr class="row-status">';
  html += '<td class="rh">Status</td>';
  steps.forEach(s => {
    html += `<td class="${s.isHit ? 's-hit' : 's-fault'}">${s.isHit ? 'HIT' : 'MISS'}</td>`;
  });
  html += '</tr>';

  html += '</tbody></table></div>';
  return html;
}

function runSim() {
  const v = validate();
  if (!v) return;
  const { pages, frames: nf } = v;
  let result;
  if (selectedAlgo === 'FIFO')         result = fifo(pages, nf);
  else if (selectedAlgo === 'Optimal') result = optimal(pages, nf);
  else                                 result = lru(pages, nf);

  const out = document.getElementById('output');
  out.style.opacity = '0';
  out.innerHTML = renderOutput(result, pages, nf, selectedAlgo);
  requestAnimationFrame(() => {
    out.style.transition = 'opacity .25s ease';
    out.style.opacity = '1';
  });
}

window.addEventListener('DOMContentLoaded', runSim);
</script>
</body>
</html>
